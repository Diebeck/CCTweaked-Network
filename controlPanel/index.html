<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/img/device_icons/computer.png">
    <title>Control Panel</title>
    <script type="importmap">
        {"imports": {
                "three": "https://unpkg.com/three@0.186.1/build/three.module.js"
        }}
    </script>
    <script src="js/main.js" type="module"></script>
</head>
<body>
    <div id="prompt">
        <p style="margin-bottom: 10px;">Title</p>
        <input type="text" placeholder="..." spellcheck="false"><br>
        <button class="submit">Submit</button>
        <button class="cancel">Cancel</button>
    </div>
    <div id="alert">
        <p></p>
        <button style="margin-bottom: 0;">Ok</button>
    </div>

    <aside>
        <details>
            <summary>Settings</summary>
            <div>

            </div>
        </details>

        <details open>
            <summary>Device Selector</summary>
            <div>
                <div style="display: flex;">
                    <button id="find" style="width: 30px; padding-left: 8px;" title="Refresh devices">⇄</button>
                    <select id="worldSelector" style="min-width: 0; flex-grow: 1;"></select>
                </div>
                <div id="deviceSelector"></div>
            </div>
        </details>

        <details open>
            <summary>World Info</summary>
            <div>
                <table id="worldInfo" style="width: 100%;"></table>
            </div>
        </details>

        <details>
            <summary>World Chat</summary>
            <div id="worldChat" class="chat">
                <div id="worldChatLog" class="nice-scrollbar chatLog"></div>
                <input type="text" id="worldChatInput" placeholder="...">
            </div>
        </details>

        <details open>
            <summary>Device Actions</summary>
            <div id="deviceActions">
                <button id="connectBtn" title="Connect to the device using CloudCatcher">Connect</button>
                <button id="runCodeBtn" title="Run LUA code on the device">Run Code</button>
                <button id="rebootBtn" title="Reboot the device">Reboot</button>
                <button id="infectBtn" title="Copies connection programs onto the device in the attached disk drive">Infect</button>
                <fieldset>
                <button id="setIdBtn" title="Changes the ID of the device">Set ID</button>
                <button id="setWorldBtn" title="Changes the World of the device">Set World</button>
                <button id="setLabelBtn" title="Changes the Label of the device">Set Label</button>
                <button id="setDescriptionBtn" title="Changes the Description of the device">Set Description</button>
                <button id="setAutorunBtn" title="Changes the program that will run on startup">Set Autorun</button>
                </fieldset>
            </div>
        </details>

        <details open>
            <summary>Device Info</summary>
            <div>
                <table id="deviceInfo" style="width: 100%;"></table>
            </div>
        </details>

        <details>
            <summary>Device Chat</summary>
            <div id="deviceChat" class="chat">
                <div id="deviceChatLog" class="nice-scrollbar chatLog"></div>
                <input type="text" id="deviceChatInput" placeholder="...">
            </div>
        </details>

        <details>
            <summary>WebSocket Log</summary>
            <div id="socketLog" class="nice-scrollbar"></div>
        </details>
    </aside>

    <div id="main">
        
    </div>
</body>
</html>
